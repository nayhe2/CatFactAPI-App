services:
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "5150:8080"
    volumes:
      - ./api:/app
      - /app/bin
      - /app/obj
      - ./data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DATA_PATH=/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:5150/api
    depends_on:
      - backend
